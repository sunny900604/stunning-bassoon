<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>굿팝업 운영 프로그램</title>
<style>
  :root{
    --blue:#1B5CB8; --blue-2:#164A94; --blue-light:#EAF1FB; --blue-pale:#F5F8FD;
    --ink:#141821; --g600:#5B6472; --g400:#9AA3AF; --g200:#E4E8EE; --g100:#F1F3F6; --white:#fff;
    --amber:#C98A1E; --amber-bg:#FCF3E1; --green:#2E8B57; --green-bg:#E7F5EC;
    --red:#C0392B; --red-bg:#FBEAEA; --purple:#6B4FA8; --purple-bg:#F0EBF9;
    --sh:0 1px 2px rgba(20,30,50,.06),0 1px 8px rgba(20,30,50,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--g100);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:224px;flex-shrink:0;background:var(--white);border-right:1px solid var(--g200);
    padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .logo{font-size:14.5px;font-weight:800;color:var(--blue);letter-spacing:-.02em;padding:0 8px}
  .logo-sub{font-size:10.5px;color:var(--g400);margin:3px 0 18px;padding:0 8px}
  .nav-label{font-size:10px;font-weight:700;color:var(--g400);margin:14px 8px 5px;letter-spacing:.04em}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--g600);cursor:pointer;margin-bottom:1px}
  .nav-item:hover{background:var(--g100)}
  .nav-item.active{background:var(--blue-light);color:var(--blue)}
  .main{flex:1;padding:26px 26px 80px;min-width:0;max-width:1180px}
  .hidden{display:none!important}

  .phead{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .phead h1{font-size:20px;font-weight:700;margin:0 0 3px;letter-spacing:-.02em}
  .phead p{margin:0;font-size:12.5px;color:var(--g600)}
  .btn-p{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--sh);white-space:nowrap}
  .btn-p:hover{background:var(--blue-2)}
  .btn-s{background:var(--white);color:var(--blue);border:1px solid var(--g200);border-radius:8px;
    padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn-s:hover{background:var(--blue-pale)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
  .kpi{background:var(--white);border-radius:12px;padding:15px 16px;box-shadow:var(--sh)}
  .kpi .n{font-size:23px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
  .kpi .n small{font-size:12px;font-weight:700;margin-left:2px}
  .kpi .l{font-size:11.5px;color:var(--g600);font-weight:600;margin-top:2px}
  .kpi .d{font-size:10.5px;color:var(--g400);margin-top:5px}

  .card{background:var(--white);border-radius:12px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .card-h h2{font-size:14px;margin:0;font-weight:700}
  .card-h .sub{font-size:11px;color:var(--g400);font-weight:600}
  .card-b{padding:16px 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--g100);padding:9px 10px;text-align:left;font-weight:700;font-size:11.5px;
    color:var(--g600);border-bottom:1px solid var(--g200);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--g200);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--blue-pale)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow-x:auto}
  .clickable{cursor:pointer}

  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .t-진행{background:var(--blue-light);color:var(--blue)}
  .t-완료,.t-상반기완료{background:var(--green-bg);color:var(--green)}
  .t-대기{background:var(--amber-bg);color:var(--amber)}
  .t-취소{background:var(--g100);color:var(--g400)}
  .c-식품{background:var(--green-bg);color:var(--green)}
  .c-뷰티{background:var(--purple-bg);color:var(--purple)}
  .c-화장품{background:var(--purple-bg);color:var(--purple)}
  .c-리빙{background:var(--amber-bg);color:var(--amber)}
  .c-기타{background:var(--g100);color:var(--g600)}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-label{width:64px;font-size:12px;font-weight:600;flex-shrink:0}
  .bar-track{flex:1;background:var(--g100);border-radius:5px;height:20px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:5px;background:var(--blue);display:flex;align-items:center;
    justify-content:flex-end;padding-right:6px;color:#fff;font-size:10.5px;font-weight:700;min-width:2px}
  .bar-val{width:74px;text-align:right;font-size:11.5px;font-weight:700;color:var(--g600);flex-shrink:0;font-variant-numeric:tabular-nums}

  .pipe{display:flex;gap:8px;flex-wrap:wrap}
  .pipe-step{flex:1;min-width:110px;background:var(--g100);border-radius:9px;padding:12px 13px}
  .pipe-step .pn{font-size:19px;font-weight:800}
  .pipe-step .pl{font-size:11px;font-weight:700;color:var(--g600);margin-top:1px}
  .pipe-step .pq{font-size:10.5px;color:var(--g400);margin-top:3px}
  .pipe-step.s-대기{background:var(--amber-bg)} .pipe-step.s-대기 .pn{color:var(--amber)}
  .pipe-step.s-진행{background:var(--blue-light)} .pipe-step.s-진행 .pn{color:var(--blue)}
  .pipe-step.s-완료{background:var(--green-bg)} .pipe-step.s-완료 .pn{color:var(--green)}
  .pipe-step.s-취소{background:var(--g100)} .pipe-step.s-취소 .pn{color:var(--g400)}

  .br-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}
  .br-card{background:var(--white);border-radius:12px;padding:15px;box-shadow:var(--sh);cursor:pointer;border:2px solid transparent}
  .br-card:hover{border-color:var(--blue-light)}
  .br-card.sel{border-color:var(--blue);background:var(--blue-pale)}
  .br-card .bn{font-size:14px;font-weight:800}
  .br-card .bq{font-size:20px;font-weight:800;color:var(--blue);margin-top:5px;letter-spacing:-.02em}
  .br-card .bl{font-size:10.5px;color:var(--g600);font-weight:600}
  .br-card .bm{font-size:10px;color:var(--g400);margin-top:5px;line-height:1.5}

  .chk-grid{overflow-x:auto}
  .chk-cell{text-align:center;cursor:pointer;user-select:none}
  .chk-dot{width:19px;height:19px;border-radius:5px;border:2px solid var(--g200);display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;color:#fff;background:#fff}
  .chk-dot.on{background:var(--blue);border-color:var(--blue)}
  .prog-track{background:var(--g100);border-radius:5px;height:7px;overflow:hidden;width:56px;display:inline-block;vertical-align:middle}
  .prog-fill{background:var(--blue);height:100%}

  .detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .back-btn{border:1px solid var(--g200);background:#fff;border-radius:7px;padding:6px 12px;
    font-size:12px;font-weight:700;cursor:pointer;color:var(--g600)}
  .back-btn:hover{background:var(--g100)}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .meta-item .mk{font-size:10.5px;color:var(--g400);font-weight:700;margin-bottom:2px}
  .meta-item .mv{font-size:12.5px;font-weight:600;word-break:break-all}

  .empty{text-align:center;padding:44px 20px;color:var(--g400);font-size:12.5px}
  .note-box{background:var(--amber-bg);color:#8A5F13;border-radius:8px;padding:10px 13px;font-size:11.5px;font-weight:600;line-height:1.6}

  .overlay{position:fixed;inset:0;background:rgba(18,24,34,.45);display:none;align-items:center;
    justify-content:center;z-index:60;padding:16px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:440px;padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 15px;font-size:15.5px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--g600);margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--g200);
    border-radius:7px;font-size:13px;font-family:inherit;background:var(--g100)}
  .fld textarea{resize:vertical;min-height:44px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .m-acts{display:flex;gap:8px;margin-top:16px}
  .m-acts button{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
  .bs{background:var(--g100);color:var(--g600)} .bp{background:var(--blue);color:#fff} .bd{background:var(--red-bg);color:var(--red)}

  .kpi-board-row{background:#fff;border-radius:10px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh)}
  .kpi-board-row .kt{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .kpi-board-row .kd{font-size:11.5px;color:var(--g600);line-height:1.65}
  .kpi-board-row .kd b{color:var(--ink)}
  .pri{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;flex-shrink:0}
  .pri-상{background:var(--red-bg);color:var(--red)} .pri-중{background:var(--amber-bg);color:var(--amber)} .pri-하{background:var(--g100);color:var(--g600)}

  @media(max-width:920px){
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;padding:12px;display:flex;gap:5px;overflow-x:auto;white-space:nowrap}
    .logo,.logo-sub,.nav-label{display:none}
    .nav-item{flex-shrink:0;margin-bottom:0}
    .main{padding:18px 13px 60px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .br-cards{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="logo">🔵 굿팝업</div>

      <div class="nav-item" data-p="company">🏢 기업별 현황</div>
      <div class="nav-item" data-p="alloc">📦 배분 관리</div>

      <div class="nav-item" data-p="gap">⚠️ 데이터 공백</div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="overlay" id="ov"><div class="modal" id="modalBox"></div></div>

/* ---------- 집계 ---------- */
const sum = (arr,f) => arr.reduce((a,b)=>a+(f(b)||0),0);
const allocByBranch = b => D.allocs.filter(a=>a.br===b);
const allocByCo = c => D.allocs.filter(a=>a.co===c);
const setsByBranch = b => D.settlements.filter(s=>s.br===b);
const setsByCo = c => D.settlements.filter(s=>s.co===c);
const promoByCo = c => D.promos.filter(p=>p.co===c);
const checkOf = c => D.checks.find(x=>x.co===c) || {co:c,steps:[0,0,0,0,0,0,0,0]};
const soldByCo = coName => sum(allocByCo(coName), a=>a.sold);
const unitPrice = c => c.salePrice || c.listPrice || 0;
function impactByCo(c){
  const revenue = soldByCo(c.name) * unitPrice(c);
  const profit = revenue * IMPACT.netMarginRate;
  const months = profit / IMPACT.monthlySupportCost;
  return { revenue, profit, months };
}
function totalImpact(){
  return D.companies.reduce((t,c)=>{ const i=impactByCo(c);
    t.revenue+=i.revenue; t.profit+=i.profit; t.months+=i.months; return t;
  }, {revenue:0, profit:0, months:0});
}
const donationByCo = c => (c.cost||0) * (c.fixed||0);
const totalDonation = () => sum(D.companies, donationByCo);

// 지점별 최대 단일 방문객 = 중복제거 하한 추정
function realVisitors(){
  let t = 0;
  BRANCHES.forEach(b=>{
    const v = setsByBranch(b.name).map(s=>s.vis);
    t += v.length ? Math.max(...v) : 0;
  });
  return t;
}
function totals(){
  return {
    alloc: sum(D.allocs,a=>a.qty),
    fixed: sum(D.companies,c=>c.fixed),
    visitors: sum(D.settlements,s=>s.vis),
    activeCo: D.companies.filter(c=>c.status==="진행").length,
    doneCo: D.companies.filter(c=>c.status==="완료"||c.status==="상반기완료").length,
    waitCo: D.companies.filter(c=>c.status==="대기").length,
    cancelCo: D.companies.filter(c=>c.status==="취소").length,
    allocCo: new Set(D.allocs.filter(a=>a.qty>0).map(a=>a.co)).size,
    realVis: realVisitors(),
    views: sum(D.promos,p=>p.views),
    reach: sum(D.promos,p=>p.reach),
    react: sum(D.promos,p=>p.likes)+sum(D.promos,p=>p.saves)
  };
}
function catTotals(){
  const m = {};
  D.allocs.forEach(a=>{ const k=a.cat||"기타"; m[k]=(m[k]||0)+(a.qty||0); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function statTag(s){

}
function prodRows(al){
  const m = {};
  al.forEach(a=>{ const k=a.prod||"(제품명 미지정)"; if(!m[k])m[k]={q:0,n:0}; m[k].q+=a.qty; m[k].n++; });
  const ent = Object.entries(m);
  if(ent.length<2) return "";
  return `<div class="card"><div class="card-h"><h2>제품별 소계</h2>
    <span class="sub">한 기업이 여러 제품을 기증한 경우</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>제품명</th><th class="num">배분 지점 수</th>
      <th class="num">배분 수량</th></tr></thead><tbody>
      ${ent.sort((x,y)=>y[1].q-x[1].q).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td>
        <td class="num">${v.n}</td><td class="num">${nf(v.q)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function barChart(rows, max){
  const mx = max || Math.max(1, ...rows.map(r=>r[1]));
  return rows.map(r=>{
    const pct = Math.round(r[1]/mx*100);
    const share = r[2]!=null ? r[2] : null;
    return `<div class="bar-row">
      <div class="bar-label">${esc(r[0])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%">${pct>18?nf(r[1]):""}</div></div>
      <div class="bar-val">${pct<=18?nf(r[1]):""}${share!=null?" ("+share+"%)":""}</div>
    </div>`;
  }).join("");
}


/* ================= 페이지 렌더 ================= */
function render(){
  const m = $("main");
  if(page==="dash") m.innerHTML = viewDash();
  else if(page==="report") m.innerHTML = viewReport();
  else if(page==="branch") m.innerHTML = viewBranch();
  else if(page==="company") m.innerHTML = selCompany ? viewCompanyDetail() : viewCompany();
  else if(page==="alloc") m.innerHTML = viewAlloc();
  else if(page==="result") m.innerHTML = viewResult();
  else if(page==="promo") m.innerHTML = viewPromo();
  else if(page==="check") m.innerHTML = viewCheck();
  else if(page==="kpi") m.innerHTML = viewKpi();
  else if(page==="guide") m.innerHTML = viewGuide();
  else if(page==="gap") m.innerHTML = viewGap();
}

/* ---------- 종합 대시보드 ---------- */

    const q = sum(allocByBranch(b.name),a=>a.qty);
    return [b.name, q, t.alloc? Math.round(q/t.alloc*100):0];
  }).sort((a,b)=>b[1]-a[1]);
  const cats = catTotals().map(c=>[c[0],c[1]]);
  const pipeline = [
    {k:"대기",n:t.waitCo,q:sum(D.companies.filter(c=>c.status==="대기"),c=>c.expected)},
    {k:"진행",n:t.activeCo,q:sum(D.companies.filter(c=>c.status==="진행"),c=>c.fixed)},
    {k:"완료",n:t.doneCo,q:sum(D.companies.filter(c=>c.status==="완료"||c.status==="상반기완료"),c=>c.fixed)},
    {k:"취소",n:t.cancelCo,q:0}

  const avgCheck = Math.round(D.checks.reduce((a,c)=>a+c.steps.reduce((x,y)=>x+y,0),0)/Math.max(1,D.checks.length)/8*100);

  const topCo = D.companies.map(c=>({n:c.name,q:sum(allocByCo(c.name),a=>a.qty)}))
    .filter(x=>x.q>0).sort((a,b)=>b.q-a.q).slice(0,8).map(x=>[x.n,x.q]);

  const missing = D.allocs.filter(a=>a.qty===0);
  const estQty = sum(D.allocs.filter(a=>a.stat==="추정"),a=>a.qty);
  const confirmedQty = t.alloc - estQty;

  return `
  <div class="phead"><div><h1>종합 대시보드</h1>

    <button class="btn-p" onclick="openAlloc()">+ 배분 등록</button></div>

  <div class="kpis">
    <div class="kpi"><div class="n">${nf(t.alloc)}<small>개</small></div><div class="l">총 배분 수량</div>
      <div class="d">확정 ${nf(confirmedQty)} + 추정 ${nf(estQty)}</div></div>
    <div class="kpi"><div class="n">${t.allocCo}<small>개사</small></div><div class="l">배분 진행 기업</div>
      <div class="d">전체 등록 ${D.companies.length}개사 중</div></div>
    <div class="kpi"><div class="n">${nf(t.realVis)}<small>명</small></div><div class="l">실방문객 (중복제거)</div>
      <div class="d" style="color:var(--amber);font-weight:600">단순합계는 ${nf(t.visitors)}명 — 기간 중복분 포함</div></div>
    <div class="kpi"><div class="n">${avgCheck}<small>%</small></div><div class="l">평균 온보딩 진행률</div>
      <div class="d">8단계 기준 전체 기업 평균</div></div>
  </div>

  <div class="card"><div class="card-h"><h2>기증 파이프라인</h2><span class="sub">진행상황별 기업 수 · 수량</span></div>
    <div class="card-b"><div class="pipe">
      ${pipeline.map(p=>`<div class="pipe-step s-${p.k}"><div class="pn">${p.n}</div>
        <div class="pl">${p.k}</div><div class="pq">${nf(p.q)}개</div></div>`).join("")}
    </div></div></div>

  <div class="grid2">
    <div class="card"><div class="card-h"><h2>지점별 배분량</h2><span class="sub">괄호는 전체 대비 비중</span></div>
      <div class="card-b">${barChart(brRows)}</div></div>
    <div class="card"><div class="card-h"><h2>품목분류별 배분량</h2></div>
      <div class="card-b">${barChart(cats)}</div></div>
  </div>

  <div class="card"><div class="card-h"><h2>기업별 배분량 상위</h2>
    <button class="btn-s" onclick="go('company')">전체 보기</button></div>
    <div class="card-b">${barChart(topCo)}</div></div>

  <div class="card"><div class="card-h"><h2>홍보 채널 누적 성과</h2></div>
    <div class="card-b"><div class="meta-grid">
      <div class="meta-item"><div class="mk">인스타 누적 조회수</div><div class="mv">${nf(t.views)}회</div></div>
      <div class="meta-item"><div class="mk">인스타 반응 (좋아요+저장)</div><div class="mv">${nf(t.react)}건</div></div>
      <div class="meta-item"><div class="mk">문자·당근 도달</div><div class="mv">${nf(t.reach)}명</div></div>
      <div class="meta-item"><div class="mk">QR 스캔 수집</div><div class="mv">${nf(sum(D.promos,p=>p.qr))}건</div></div>
    </div></div></div>

  ${(missing.length||estQty)?`<div class="card"><div class="card-h"><h2>⚠ 확인이 필요한 데이터</h2>
    <button class="btn-s" onclick="go('alloc')">배분 관리로</button></div>
    <div class="card-b">
    ${estQty?`<div class="note-box" style="margin-bottom:9px">
      <b>추정 배분 ${nf(estQty)}개</b> — 라바섬&퓨어메르는 전 지점 순회 진행이었으나 원본에 지점별 수량이 없어 균등 배분으로 추정했습니다. 실제 수량을 알면 지점별로 수정해주세요.</div>`:""}
    ${missing.length?`<div class="note-box">
      <b>수량 미입력 ${missing.length}건</b> — ${missing.map(m=>esc(m.co)+(m.br?"("+esc(m.br)+")":"")).join(" · ")}<br>
      원본 관리표에 배분 수량이 기재되지 않은 건입니다. 채워 넣으면 모든 집계에 즉시 반영됩니다.</div>`:""}
    </div></div>`:""}
  `;
}

      <tbody>${cmpRows}</tbody></table></div></div>

  <div class="card"><div class="chk-grid"><table><thead><tr><th>기업명</th><th>상태</th>

}
async function editCost(name){
  const c = D.companies.find(x=>x.name===name);
  if(!c) return;
  const v = prompt(`${name} — 원가(개당, 기부금영수증 산정 기준 · 정가 아님)`, c.cost||0);
  if(v===null) return;
  const n = parseInt(v,10);
  c.cost = isNaN(n)?0:n;
  await save(); render();
}
async function toggleStep(co,i){
  let ck = D.checks.find(x=>x.co===co);
  if(!ck){ ck={co:co,steps:[0,0,0,0,0,0,0,0]}; D.checks.push(ck); }
  ck.steps[i] = ck.steps[i]?0:1;
  await save(); render();
}

function viewKpi(){
  const t = totals();
  const rows = KPI_BOARD.map((k,i)=>`<div class="kpi-board-row">

  {c:"플라워데스크", f:"예상 수량", v:"물품상태='120' / 예상수량='60개(두박스)'", w:"120과 60 중 어느 것이 맞는지", p:"중간"}
];
const RULE_GAPS = [
  {t:"연도 컬럼", s:"세상에없는세상·밀드플레르·벨코드코리아 3건이 접수일 연도와 불일치 (연도=2026, 접수일=2025)", r:"접수일 기준으로 자동 산출하거나 연도 컬럼 폐지"},
  {t:"지점명 표기", s:"'우리금융'과 '우금'이 혼용됨", r:"'우리금융'으로 통일 (드롭다운 사용)"},
  {t:"지점명 표기", s:"'하남점/구리점'처럼 '점'이 붙은 표기와 안 붙은 표기 혼용", r:"'점' 없이 통일"},
  {t:"행사지점 vs 배분지점", s:"두 컬럼의 정의가 불명확 (계획인지 실적인지)", r:"'행사지점=예정', '배분지점=실적'으로 정의 고정"}
];

function viewGap(){
  const t = totals();
  const estQty = sum(D.allocs.filter(a=>a.stat==="추정"),a=>a.qty);
  const zeroRows = D.allocs.filter(a=>a.qty===0);
  const noBranch = D.allocs.filter(a=>!a.br);
  // 확정기증은 있는데 배분이 0인 기업
  const unallocated = D.companies.filter(c=>{
    const q = sum(allocByCo(c.name),a=>a.qty);
    return c.fixed>0 && q===0;
  });
  const noSettle = D.companies.filter(c=>{
    const q = sum(allocByCo(c.name),a=>a.qty);
    return q>0 && setsByCo(c.name).length===0;
  });
  const noPromo = D.companies.filter(c=>{
    const q = sum(allocByCo(c.name),a=>a.qty);
    return q>0 && promoByCo(c.name).length===0;
  });
  const unallocQty = sum(unallocated,c=>c.fixed);
  const estPct = t.alloc? Math.round(estQty/t.alloc*100):0;

  const dupSets = D.settlements.filter(s=>s.dup);
  const visGap = t.visitors - t.realVis;

  return `<div class="phead"><div><h1>데이터 공백 · 수정 점검</h1>
    <p>원본에서 파악되지 않거나 잘못 표기된 항목 · 채울수록 대시보드 정확도가 올라갑니다</p></div></div>

  ${visGap>0?`<div class="card" style="border:2px solid var(--red)"><div class="card-h">
    <h2 style="color:var(--red)">🔴 방문객 수 중복 집계 — 가장 시급합니다</h2></div>
    <div class="card-b">
    <div style="font-size:12.5px;line-height:1.8;margin-bottom:12px">
      방문객 수는 브랜드별이 아니라 <b>그 기간의 지점 방문객</b>으로 보입니다.
      같은 지점에서 행사 기간이 겹친 브랜드가 ${dupSets.length}건 있어, 브랜드끼리 더하면 같은 손님을 여러 번 세게 됩니다.</div>
    <div class="tbl-wrap"><table><thead><tr><th>지점</th><th>겹치는 행사</th>
      <th class="num">단순 합계</th><th class="num">최대 단일값</th><th class="num">중복 가능분</th></tr></thead><tbody>
      ${BRANCHES.map(b=>{
        const ev = setsByBranch(b.name).filter(s=>s.vis>0);
        if(ev.length<2) return "";
        const s2 = sum(ev,x=>x.vis), mx = Math.max(...ev.map(x=>x.vis));
        return `<tr><td><b>${esc(b.name)}</b></td>
          <td style="font-size:11.5px">${ev.map(x=>esc(x.co)+" "+x.d1.slice(5)+"~"+x.d2.slice(5)+"("+nf(x.vis)+")").join(" · ")}</td>
          <td class="num" style="color:var(--red);font-weight:700">${nf(s2)}</td>
          <td class="num" style="color:var(--green);font-weight:700">${nf(mx)}</td>
          <td class="num">${nf(s2-mx)}</td></tr>`;
      }).join("")}
    </tbody></table></div>
    <div class="note-box" style="margin-top:11px">
      전체 기준 <b>단순합계 ${nf(t.visitors)}명 → 실방문객 ${nf(t.realVis)}명</b> (최대 ${nf(visGap)}명 중복 가능).
      대시보드는 현재 '실방문객'을 기본 지표로 쓰고 있습니다. 방문객 수가 브랜드별 집계가 맞다면 알려주세요 — 단순합계로 되돌리겠습니다.</div>
    </div></div>`:""}

  <div class="card"><div class="card-h"><h2>🟢 이미 교정한 오기입</h2>
    <span class="sub">값이 명백히 다른 칸에 들어간 건 — 되돌리려면 알려주세요</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>기업</th><th>항목</th><th>원본 값</th><th>교정 값</th></tr></thead><tbody>
      ${FIXED_LOG.map(f=>`<tr><td><b>${esc(f.c)}</b></td><td>${esc(f.f)}</td>
        <td style="font-size:11.5px;color:var(--g400);text-decoration:line-through">${esc(f.b)}</td>
        <td style="font-size:11.5px;color:var(--green);font-weight:700">${esc(f.a)}</td></tr>`).join("")}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>🟡 확인이 필요한 표기</h2>
    <span class="sub">원본에 서로 다른 값이 적혀 있어 자동 판단이 불가한 건</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>기업</th><th>항목</th><th>원본에 적힌 값</th><th>무엇이 문제인가</th><th>우선순위</th></tr></thead><tbody>
      ${NEED_CHECK.map(c=>`<tr><td><b>${esc(c.c)}</b></td><td>${esc(c.f)}</td>
        <td style="font-size:11.5px">${esc(c.v)}</td>
        <td style="font-size:11.5px;color:var(--g600)">${esc(c.w)}</td>
        <td><span class="tag ${c.p==="높음"?"t-취소":"t-대기"}" ${c.p==="높음"?'style="background:var(--red-bg);color:var(--red)"':''}>${esc(c.p)}</span></td></tr>`).join("")}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>⚪ 표기 규칙 불일치</h2>
    <span class="sub">집계에는 영향 없으나 정리 권장</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>항목</th><th>현재 상태</th><th>권장</th></tr></thead><tbody>
      ${RULE_GAPS.map(r=>`<tr><td><b>${esc(r.t)}</b></td>
        <td style="font-size:11.5px;color:var(--g600)">${esc(r.s)}</td>
        <td style="font-size:11.5px;color:var(--blue)">${esc(r.r)}</td></tr>`).join("")}
    </tbody></table></div></div>

  <div class="kpis">
    <div class="kpi"><div class="n" style="color:var(--amber)">${estPct}<small>%</small></div>
      <div class="l">추정치 비중</div><div class="d">${nf(estQty)}개 / 전체 ${nf(t.alloc)}개</div></div>
    <div class="kpi"><div class="n" style="color:var(--red)">${unallocated.length}<small>개사</small></div>
      <div class="l">기증 확정, 배분 미기록</div><div class="d">합계 ${nf(unallocQty)}개 미반영</div></div>
    <div class="kpi"><div class="n" style="color:var(--red)">${noSettle.length}<small>개사</small></div>
      <div class="l">배분됐으나 결산 없음</div><div class="d">방문객 데이터 부재</div></div>
    <div class="kpi"><div class="n" style="color:var(--amber)">${zeroRows.length}<small>건</small></div>
      <div class="l">배분 수량 0</div><div class="d">원본에 수량 미기재</div></div>
  </div>

  ${unallocated.length?`<div class="card"><div class="card-h"><h2>🔴 기증은 확정됐는데 배분 기록이 없는 기업</h2>
    <span class="sub">합계 ${nf(unallocQty)}개가 집계에서 빠져 있습니다</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>기업명</th><th>상태</th><th class="num">확정 기증수량</th>
      <th>비고</th><th></th></tr></thead><tbody>
      ${unallocated.sort((a,b)=>b.fixed-a.fixed).map(c=>`<tr>
        <td><b>${esc(c.name)}</b></td><td><span class="tag t-${esc(c.status)}">${esc(c.status)}</span></td>
        <td class="num" style="font-weight:700;color:var(--red)">${nf(c.fixed)}</td>
        <td style="font-size:11px;color:var(--g600)">${esc(c.note)||"배분 지점·수량 미기재"}</td>
        <td><button class="btn-s" onclick="openAlloc(null,'${esc(c.name).replace(/'/g,"\\\\'")}')">배분 등록</button></td>
      </tr>`).join("")}
    </tbody></table></div></div>`:""}

  <div class="card"><div class="card-h"><h2>⚠️ 배분 수량이 0으로 남은 건</h2>
    <span class="sub">원본에 수량이 적히지 않은 항목</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>기업명</th><th>지점</th><th>제품명</th><th>비고</th><th></th></tr></thead><tbody>
      ${zeroRows.length?zeroRows.map(a=>`<tr><td><b>${esc(a.co)}</b></td>
        <td>${esc(a.br)||'<span style="color:var(--red)">미지정</span>'}</td>
        <td style="font-size:11.5px">${esc(a.prod)}</td>
        <td style="font-size:11px;color:var(--g600)">${esc(a.note)}</td>
        <td><button class="btn-s" onclick="openAlloc('${a.id}')">입력</button></td></tr>`).join("")
        :`<tr><td colspan="5" class="empty">모두 입력됐습니다</td></tr>`}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>📉 성과 데이터가 없는 기업</h2>
    <span class="sub">배분은 됐으나 결산·홍보 기록이 없어 기업에 보여줄 성과가 없는 상태</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>기업명</th><th class="num">배분수량</th>
      <th>행사 결산</th><th>홍보 성과</th><th></th></tr></thead><tbody>
      ${(() => {
        const list = D.companies.filter(c=>sum(allocByCo(c.name),a=>a.qty)>0);
        return list.map(c=>{
          const hasS = setsByCo(c.name).length>0, hasP = promoByCo(c.name).length>0;
          if(hasS && hasP) return "";
          return `<tr><td><b>${esc(c.name)}</b></td>
            <td class="num">${nf(sum(allocByCo(c.name),a=>a.qty))}</td>
            <td>${hasS?'<span class="tag t-완료">있음</span>':'<span class="tag t-취소">없음</span>'}</td>
            <td>${hasP?'<span class="tag t-완료">있음</span>':'<span class="tag t-취소">없음</span>'}</td>
            <td>${!hasS?`<button class="btn-s" onclick="openSet()">결산</button> `:""}${!hasP?`<button class="btn-s" onclick="openPromo()">홍보</button>`:""}</td></tr>`;
        }).join("") || `<tr><td colspan="5" class="empty">모든 기업에 성과 데이터가 있습니다</td></tr>`;
      })()}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>🧱 구조적 공백 — 원본에 항목 자체가 없는 것</h2>
    <span class="sub">누락이 아니라 애초에 수집 체계가 없던 데이터</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>항목</th><th>현재 상태</th><th>이것이 없으면</th><th>수집 방법</th></tr></thead><tbody>
      ${STRUCT_GAPS.map(g=>`<tr><td><b>${esc(g.t)}</b></td>
        <td style="font-size:11.5px;color:var(--g600)">${esc(g.s)}</td>
        <td style="font-size:11.5px">${esc(g.w)}</td>
        <td style="font-size:11.5px;color:var(--blue)">${esc(g.h)}</td></tr>`).join("")}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>🔀 데이터 충돌 · 중복 의심</h2>
    <span class="sub">값은 있으나 서로 맞지 않아 확인이 필요한 항목</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>구분</th><th>발견 내용</th><th>왜 문제인가</th><th>확인할 것</th></tr></thead><tbody>
      ${CONFLICTS.map(c=>`<tr><td><span class="tag t-대기">${esc(c.k)}</span></td>
        <td style="font-size:11.5px"><b>${esc(c.f)}</b></td>
        <td style="font-size:11.5px;color:var(--g600)">${esc(c.c)}</td>
        <td style="font-size:11.5px;color:var(--blue)">${esc(c.a)}</td></tr>`).join("")}
    </tbody></table></div></div>

  <div class="card"><div class="card-h"><h2>✅ 지금 바로 하면 좋은 것</h2></div><div class="card-b">
    <div style="font-size:12.5px;line-height:2">
    <b>1.</b> 라바섬 지점별 실수량 확인 — 전체 배분량의 ${estPct}%가 추정치입니다<br>
    <b>2.</b> 코스메랩 13,800개 배분 계획 확정 — 확정 시 총 배분량이 3배 가까이 증가합니다<br>
    <b>3.</b> 당근 534명 중복 여부 확인 — 중복이면 도달 합계를 하향 조정해야 합니다<br>
    <b>4.</b> 한마당 공릉·우리금융 방문객 집계 마감 — 누적 방문객이 과소 집계 상태입니다<br>
    <b>5.</b> 판매/소진 수량 수집 체계 도입 — 기업 제안 근거가 방문객 수 하나뿐입니다<br>
    <b>6.</b> 행사지점·배분지점 정의 통일 — 6개사에서 두 값이 어긋납니다</div>
  </div></div>`;
}

/* ================= 모달 (입력/수정) ================= */
let editType = null, editId = null;
const closeM = () => { $("ov").classList.remove("open"); editType=null; editId=null; };
const coOptions = sel => D.companies.map(c=>`<option value="${esc(c.name)}"${c.name===sel?" selected":""}>${esc(c.name)}</option>`).join("");
const brOptions = sel => BRANCHES.map(b=>`<option value="${esc(b.name)}"${b.name===sel?" selected":""}>${esc(b.name)}</option>`).join("");

function openAlloc(id, presetCo){
  editType="alloc"; editId=id||null;
  const a = id ? D.allocs.find(x=>x.id===id) : null;
  $("modalBox").innerHTML = `<h3>${a?"배분 수정":"배분 등록"}</h3>
    <div class="fld"><label>기업명</label><select id="m-co">${coOptions(a?a.co:presetCo)}</select></div>
    <div class="row2">
      <div class="fld"><label>지점</label><select id="m-br">${brOptions(a?a.br:null)}</select></div>
      <div class="fld"><label>차수</label><input id="m-cha" value="${a?esc(a.cha):"2차"}"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>품목분류</label><select id="m-cat">
        ${["식품","뷰티","화장품","리빙/생활용품","가방","의류","기타"].map(c=>
          `<option${a&&a.cat===c?" selected":""}>${c}</option>`).join("")}</select></div>
      <div class="fld"><label>배분상태</label><select id="m-stat">
        ${["확정","추정","확인필요"].map(c=>`<option${a&&a.stat===c?" selected":""}>${c}</option>`).join("")}</select></div>
    </div>
    <div class="fld"><label>제품명</label><input id="m-prod" value="${a?esc(a.prod):""}" placeholder="예: 클렌징폼"></div>

      <div class="fld"><label>배분 수량</label><input type="number" id="m-qty" value="${a?a.qty:0}"></div>
      <div class="fld"><label>판매/소진 수량</label><input type="number" id="m-sold" value="${a?a.sold:0}"></div>

    <div class="fld"><label>비고</label><textarea id="m-note">${a?esc(a.note):""}</textarea></div>

      ${a?`<button class="bd" onclick="delRec()">삭제</button>`:""}
      <button class="bp" onclick="saveRec()">저장</button></div>`;
  $("ov").classList.add("open");
}

      ${s?`<button class="bd" onclick="delRec()">삭제</button>`:""}

}
function openPromo(id){
  editType="promo"; editId=id||null;
  const p = id ? D.promos.find(x=>x.id===id) : null;
  const chs = ["인스타그램","당근마켓","문자(SMS)","QR/온라인몰","언론보도","기타"];
  $("modalBox").innerHTML = `<h3>${p?"홍보 성과 수정":"홍보 성과 등록"}</h3>
    <div class="fld"><label>기업명</label><select id="m-co">${coOptions(p?p.co:null)}</select></div>
    <div class="row2">
      <div class="fld"><label>채널</label><select id="m-ch">
        ${chs.map(c=>`<option${p&&p.ch===c?" selected":""}>${c}</option>`).join("")}</select></div>
      <div class="fld"><label>지점</label><select id="m-br">
        <option value="전체"${p&&p.br==="전체"?" selected":""}>전체</option>${brOptions(p?p.br:null)}</select></div>
    </div>
    <div class="row2">
      <div class="fld"><label>도달/발송 수</label><input type="number" id="m-reach" value="${p?p.reach:0}"></div>
      <div class="fld"><label>조회수</label><input type="number" id="m-views" value="${p?p.views:0}"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>좋아요</label><input type="number" id="m-likes" value="${p?p.likes:0}"></div>
      <div class="fld"><label>저장</label><input type="number" id="m-saves" value="${p?p.saves:0}"></div>
    </div>
    <div class="fld"><label>QR 스캔 수</label><input type="number" id="m-qr" value="${p?p.qr:0}"></div>
    <div class="fld"><label>비고</label><textarea id="m-note">${p?esc(p.note):""}</textarea></div>
    <div class="m-acts"><button class="bs" onclick="closeM()">취소</button>
      ${p?`<button class="bd" onclick="delRec()">삭제</button>`:""}
      <button class="bp" onclick="saveRec()">저장</button></div>`;
  $("ov").classList.add("open");
}

const nv = id => { const e=$(id); return e?(parseInt(e.value,10)||0):0; };
const sv = id => { const e=$(id); return e?e.value.trim():""; };
const newId = (pre,arr) => pre + String(Date.now()).slice(-6) + Math.floor(Math.random()*90+10);

async function saveRec(){
  if(editType==="alloc"){
    const o = {co:sv("m-co"),br:sv("m-br"),cha:sv("m-cha"),cat:sv("m-cat"),prod:sv("m-prod"),
      stat:sv("m-stat"),qty:nv("m-qty"),sold:nv("m-sold"),note:sv("m-note")};
    if(!o.co||!o.br){ alert("기업명과 지점을 선택해주세요."); return; }
    if(editId){ Object.assign(D.allocs.find(x=>x.id===editId), o); }
    else { o.id=newId("A",D.allocs); D.allocs.push(o); }
  } else if(editType==="set"){
    const o = {co:sv("m-co"),br:sv("m-br"),d1:sv("m-d1"),d2:sv("m-d2"),
      vis:nv("m-vis"),sold:nv("m-sold"),note:sv("m-note")};
    if(!o.co||!o.br){ alert("기업명과 지점을 선택해주세요."); return; }
    if(editId){ Object.assign(D.settlements.find(x=>x.id===editId), o); }
    else { o.id=newId("S",D.settlements); D.settlements.push(o); }
  } else if(editType==="promo"){
    const o = {co:sv("m-co"),br:sv("m-br"),ch:sv("m-ch"),reach:nv("m-reach"),views:nv("m-views"),
      likes:nv("m-likes"),saves:nv("m-saves"),qr:nv("m-qr"),note:sv("m-note")};
    if(!o.co){ alert("기업명을 선택해주세요."); return; }
    if(editId){ Object.assign(D.promos.find(x=>x.id===editId), o); }
    else { o.id=newId("P",D.promos); D.promos.push(o); }
  }
  await save(); closeM(); render();
}
async function delRec(){
  if(!editId) return;
  if(!confirm("이 기록을 삭제할까요?")) return;
  if(editType==="alloc") D.allocs = D.allocs.filter(x=>x.id!==editId);
  if(editType==="set") D.settlements = D.settlements.filter(x=>x.id!==editId);
  if(editType==="promo") D.promos = D.promos.filter(x=>x.id!==editId);
  await save(); closeM(); render();
}

/* ================= 네비 ================= */
function go(p){
  page = p; selCompany = null;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.p===p));
  render(); window.scrollTo(0,0);
}
$("nav").addEventListener("click", e=>{
  const it = e.target.closest(".nav-item");
  if(it) go(it.dataset.p);
});
$("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeM(); });

load();
</script>
</body>
